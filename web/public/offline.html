<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>You are offline | Kobo Kobo</title>
<style>
  html, body { margin: 0; height: 100%; background: #ffffff; color: #0f172a; font-family: Arial, Helvetica, sans-serif; }
  main { min-height: 100%; display: flex; flex-direction: column; justify-content: center; padding: 24px; max-width: 420px; margin: 0 auto; }
  .mark { width: 48px; height: 48px; border-radius: 12px; background: #1d4ed8; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 26px; }
  h1 { font-size: 26px; margin: 24px 0 8px; }
  p { color: #475569; line-height: 1.5; margin: 0 0 24px; }
  button { align-self: flex-start; background: #1d4ed8; color: #fff; border: 0; border-radius: 10px; padding: 12px 20px; font-size: 16px; font-weight: 700; }
</style>
</head>
<body>
<main>
  <div class="mark" aria-hidden="true">K</div>
  <h1>You are offline</h1>
  <p>Your savings are safe. Kobo Kobo needs a connection to show your balance. Check your network and try again.</p>
  <button onclick="location.reload()">Try again</button>
</main>
</body>
</html>
